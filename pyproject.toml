[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-mantis-nhanes"
version = "0.1.0"
description = "Cross-cycle NHANES wearable-data transportability analysis"
requires-python = ">=3.11,<3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
